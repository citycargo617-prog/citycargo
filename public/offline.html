<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — City Cargo</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#004b71" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border-radius: 1.5rem;
        box-shadow: 0 10px 30px rgba(0, 75, 113, 0.08);
        padding: 2.5rem 1.75rem;
        max-width: 440px;
        width: 100%;
        border: 1px solid #e2e8f0;
      }
      .icon-wrapper {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background: #eff6ff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-wrapper svg {
        width: 42px;
        height: 42px;
        stroke: #004b71;
      }
      .brand-title {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #004b71;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
      }
      .brand-title span {
        font-weight: 400;
        color: #f28020;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.95rem;
        color: #64748b;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0.875rem 1.25rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        border: none;
      }
      .btn-primary {
        background-color: #004b71;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(0, 75, 113, 0.25);
      }
      .btn-primary:hover, .btn-primary:active {
        background-color: #003652;
      }
      .btn-secondary {
        background-color: #f1f5f9;
        color: #004b71;
        margin-top: 0.75rem;
      }
      .btn-secondary:hover, .btn-secondary:active {
        background-color: #e2e8f0;
      }
      .support {
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid #f1f5f9;
        font-size: 0.85rem;
        color: #94a3b8;
      }
      .support a {
        color: #f28020;
        font-weight: 600;
        text-decoration: none;
      }
      .support a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand-title">City<span>Cargo</span></div>
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.5 8.5A6 6 0 0118 14m-12 0a5.98 5.98 0 001.5 3.97M12 20h.01M1 10a15.9 15.9 0 014.28-3.72M21 10a15.93 15.93 0 00-2.3-2.3" />
        </svg>
      </div>
      <h1>You're Currently Offline</h1>
      <p>
        It looks like you've lost your internet connection. Please check your Wi-Fi or mobile data to continue booking and tracking trucks.
      </p>
      <button class="btn btn-primary" onclick="window.location.reload()">
        ↻ Retry Connection
      </button>
      <a href="tel:+919651429006" class="btn btn-secondary">
        📞 Call Support (+91 96514 29006)
      </a>
      <div class="support">
        Need urgent assistance? Call our 24x7 team at <a href="tel:+919651429006">+91 96514 29006</a>
      </div>
    </div>
  </body>
</html>
